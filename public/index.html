<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ensalamento — La Salle</title>
  <link rel="stylesheet" href="/estilo.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a1628'/><rect x='7' y='7' width='18' height='18' fill='none' stroke='%234fd1c5' stroke-width='2' transform='rotate(45 16 16)'/></svg>" />
</head>
<body>

  <!-- ============================== LOGIN ============================== -->
  <div id="tela-login" class="tela-login oculto">
    <div class="caixa-login">
      <div class="marca">
        <div class="losango"><span>ENS</span></div>
        <div>
          <h1>Ensalamento</h1>
          <p>Provas Integradas</p>
        </div>
      </div>

      <form id="form-login" class="cartao cantos">
        <div class="canto"></div>
        <div class="rotulo-secao">Acesso</div>
        <h3 style="margin-bottom:18px">Entrar no sistema</h3>

        <div id="erro-login" class="aviso erro oculto"></div>

        <label class="campo">
          <span>E-mail</span>
          <input type="email" name="email" autocomplete="username" required placeholder="voce@soulasalle.com.br" />
        </label>
        <label class="campo">
          <span>Senha</span>
          <input type="password" name="senha" autocomplete="current-password" required placeholder="••••••••" />
        </label>

        <button class="acao" style="width:100%" type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <!-- =============================== APP =============================== -->
  <div id="app" class="oculto">
    <header class="topo">
      <div class="marca">
        <div class="losango"><span>ENS</span></div>
        <div>
          <h1>Ensalamento — La Salle</h1>
          <p>Provas Integradas</p>
        </div>
      </div>
      <div class="topo-info">
        <div><strong id="topo-nome"></strong></div>
        <div id="topo-papel"></div>
        <button class="mini" id="btn-sair" title="Sair" style="color:var(--texto-3);font-size:12px">sair</button>
      </div>
    </header>

    <div class="layout">
      <nav class="lateral" id="menu"></nav>
      <main id="conteudo"></main>
    </div>
  </div>

  <script src="/js/comum.js"></script>
  <script src="/js/professor.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
